```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — PLAYZONE</title>
  <link rel="stylesheet" href="../style.css">

  <style>
    .game-page {
      min-height: 100vh;
      padding: 100px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: min(700px, 100%);
      text-align: center;
    }

    .game-container h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin-bottom: 10px;
    }

    .game-container h1 span {
      color: #a855f7;
    }

    .score {
      font-size: 1.2rem;
      margin: 20px;
    }

    #game {
      display: block;
      width: min(500px, 90vw);
      height: min(500px, 90vw);
      margin: 0 auto;
      background: #090914;
      border: 2px solid #8b5cf6;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(139, 92, 246, .25);
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls button,
    .back-button {
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      cursor: pointer;
      background: #171729;
      color: white;
      font-size: 1rem;
    }

    .controls button:hover,
    .back-button:hover {
      background: #7c3aed;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 25px;
      text-decoration: none;
    }

    #message {
      min-height: 25px;
      margin: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <main class="game-page">
    <div class="game-container">

      <a href="../index.html" class="back-button">
        ← Volver a PLAYZONE
      </a>

      <h1>🐍 <span>Snake</span></h1>

      <p>Usa las flechas o WASD para moverte.</p>

      <div class="score">
        Puntuación: <strong id="score">0</strong>
      </div>

      <canvas id="game" width="500" height="500"></canvas>

      <p id="message"></p>

      <div class="controls">
        <button type="button" id="up">⬆️</button>
        <button type="button" id="left">⬅️</button>
        <button type="button" id="down">⬇️</button>
        <button type="button" id="right">➡️</button>
        <button type="button" id="restart">🔄 Reiniciar</button>
      </div>

    </div>
  </main>

  <script src="snake.js"></script>

</body>
</html>
```
